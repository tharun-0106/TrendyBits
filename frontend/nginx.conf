server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_read_timeout 300s;   # local 8B reasoning models can take a while
  }

  location / {
    try_files $uri /index.html;
  }
}
